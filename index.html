<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f7ead4">
<title>森林故事屋｜互動點讀繪本</title>
<style>
:root{
  --paper:#fffaf0;--ink:#59483b;--brown:#8b6248;--orange:#e6a45e;
  --green:#71876a;--pink:#d98f83;--shadow:0 14px 38px rgba(91,65,42,.13);
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;color:var(--ink);
  font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;
  background:
    radial-gradient(circle at 10% 15%,rgba(230,164,94,.18),transparent 25%),
    radial-gradient(circle at 90% 80%,rgba(113,135,106,.16),transparent 27%),
    #f7ead4;
}
button{font:inherit;cursor:pointer;border:0}
button:focus-visible{outline:3px solid #bf7847;outline-offset:3px}
.app{width:min(1120px,94%);margin:0 auto;padding:24px 0 38px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
.brand{font-weight:900;letter-spacing:2px;font-size:1.15rem}
.brand span{color:var(--green)}
.sound-toggle,.small-btn{
  background:#fffaf0;color:var(--ink);border:1px solid #ead9c3;
  border-radius:999px;padding:10px 16px;box-shadow:0 4px 12px #76563812
}
.cover,.reader{
  background:rgba(255,250,240,.94);border:1px solid #ead9c3;
  border-radius:28px;box-shadow:var(--shadow);overflow:hidden
}
.cover{min-height:650px;display:grid;grid-template-columns:1fr 1fr;align-items:center;padding:clamp(22px,5vw,58px);gap:28px}
.cover-copy h1{font-size:clamp(2.3rem,5vw,4.5rem);line-height:1.15;margin:12px 0;color:#76543e}
.eyebrow{color:var(--green);font-weight:800;letter-spacing:3px}
.cover-copy p{font-size:1.08rem;line-height:2;color:#806d5b;max-width:430px}
.cover-art{position:relative;display:grid;place-items:center;min-height:380px}
.cover-art img{width:min(100%,430px);max-height:430px;object-fit:contain;filter:drop-shadow(0 12px 14px #65452b20)}
.start-btn,.primary{
  color:white;background:linear-gradient(135deg,#9b7658,#c38a58);
  border-radius:999px;padding:14px 28px;font-weight:800;box-shadow:0 8px 18px #986b482e
}
.start-btn{font-size:1.05rem;margin-top:14px}
.reader{display:none;padding:clamp(14px,3vw,28px)}
.reader-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.reader-head h2{margin:0;font-size:1.15rem}
.progress-wrap{height:8px;background:#eee2d2;border-radius:99px;overflow:hidden;margin:10px 0 18px}
.progress{height:100%;width:5%;background:linear-gradient(90deg,#8da17a,#e2ad70);transition:width .25s}
.book-stage{
  display:grid;grid-template-columns:1fr;gap:16px;align-items:center;
  background:#f4eadb;border-radius:20px;padding:clamp(10px,2vw,20px)
}
.page-image-wrap{position:relative;display:grid;place-items:center;min-height:280px}
#storyImage{display:block;max-width:100%;width:auto;height:auto;max-height:58vh;object-fit:contain;border-radius:12px;box-shadow:0 8px 22px #60452b20}
.image-hint{font-size:.82rem;color:#8a7765;text-align:center;margin-top:9px}
.page-controls{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px;margin-top:18px}
.nav-btn{background:#fffaf0;color:#73543d;border:1px solid #e7d7c4;border-radius:999px;padding:12px 20px;font-weight:800}
.nav-btn:disabled{opacity:.38;cursor:not-allowed}
.action-btn{background:#71876a;color:#fff;border-radius:999px;padding:12px 19px;font-weight:800}
.action-btn.music{background:#c28a57}
.action-btn.stop{background:#a97870}
.page-number{font-weight:800;color:#806b57;min-width:88px;text-align:center}
.status{min-height:24px;text-align:center;color:#8b725c;font-size:.9rem;margin-top:10px}
.bottom-note{text-align:center;color:#927d68;font-size:.8rem;margin-top:18px}
#spirit{position:fixed;width:66px;height:66px;right:18px;bottom:16px;object-fit:contain;opacity:.8;pointer-events:none}
@media(max-width:700px){
 .app{width:94%;padding-top:14px}
 .cover{grid-template-columns:1fr;min-height:0;text-align:center}
 .cover-copy p{margin-left:auto;margin-right:auto}
 .cover-art{min-height:210px;order:-1}
 .cover-art img{max-height:250px}
 .reader-head{align-items:flex-start;flex-direction:column}
 #storyImage{max-height:55vh}
 .page-controls{gap:8px}
 .nav-btn,.action-btn{padding:11px 15px}
 #spirit{width:48px;height:48px}
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">FOREST <span>STORY HOUSE</span></div>
    <button class="sound-toggle" id="bgToggle" type="button">♫ 開啟背景音樂</button>
  </header>

  <main>
    <section class="cover" id="cover">
      <div class="cover-copy">
        <div class="eyebrow">A LITTLE STORY, A BIG ADVENTURE</div>
        <h1>森林<br>故事屋</h1>
        <p>翻開故事，走進奇妙的森林世界。點一下圖片，聽聽故事；播放音樂，享受專屬的閱讀時光。</p>
        <button class="start-btn" id="startBtn" type="button">開始閱讀　→</button>
      </div>
      <div class="cover-art">
        <img id="coverImage" alt="繪本封面插圖">
      </div>
    </section>

    <section class="reader" id="reader" aria-label="繪本閱讀區">
      <div class="reader-head">
        <h2>🌿 森林故事屋・互動繪本</h2>
        <button class="small-btn" id="backCover" type="button">回到封面</button>
      </div>
      <div class="progress-wrap"><div class="progress" id="progress"></div></div>
      <div class="book-stage">
        <div>
          <div class="page-image-wrap">
            <img id="storyImage" alt="繪本故事頁面" role="button" tabindex="0" title="點擊圖片播放故事朗讀">
          </div>
          <div class="image-hint">小提示：也可以直接點擊故事圖片，播放這一頁的朗讀。</div>
        </div>
      </div>
      <div class="page-controls">
        <button class="nav-btn" id="prevBtn" type="button">← 上一頁</button>
        <span class="page-number" id="pageNumber">第 1 / 20 頁</span>
        <button class="nav-btn" id="nextBtn" type="button">下一頁 →</button>
      </div>
      <div class="page-controls">
        <button class="action-btn" id="readBtn" type="button">🔊 聽故事朗讀</button>
        <button class="action-btn music" id="musicBtn" type="button">♫ 播放本頁音樂</button>
        <button class="action-btn stop" id="stopBtn" type="button">■ 停止聲音</button>
      </div>
      <div class="status" id="status" aria-live="polite">準備好就開始閱讀吧！</div>
      <div class="bottom-note">使用下方按鈕翻頁，也可以使用鍵盤 ← → 方向鍵。</div>
    </section>
  </main>
</div>

<img id="spirit" alt="" aria-hidden="true">
<audio id="speechAudio" preload="none"></audio>
<audio id="pageMusicAudio" preload="none"></audio>
<audio id="backgroundAudio" preload="none" loop></audio>

<script>
/*
  素材資料夾請放在 index.html 同一層：
  assets/graphics/0～19（圖片）
  assets/speech/speech0.mp3～speech19.mp3
  assets/music/music0.mp3～music19.mp3
  assets/music/伴奏.mp3

  圖片副檔名目前從資料夾截圖無法確認，程式會依序測試常見格式。
*/
const TOTAL_PAGES = 20;
const GRAPHICS_DIR = "assets/graphics/";
const SPEECH_DIR = "assets/speech/";
const MUSIC_DIR = "assets/music/";
const IMAGE_EXTENSIONS = ["png","jpg","jpeg","webp","gif","PNG","JPG","JPEG"];

const cover = document.getElementById("cover");
const reader = document.getElementById("reader");
const storyImage = document.getElementById("storyImage");
const coverImage = document.getElementById("coverImage");
const pageNumber = document.getElementById("pageNumber");
const progress = document.getElementById("progress");
const statusText = document.getElementById("status");
const speechAudio = document.getElementById("speechAudio");
const pageMusicAudio = document.getElementById("pageMusicAudio");
const backgroundAudio = document.getElementById("backgroundAudio");
const bgToggle = document.getElementById("bgToggle");

let currentPage = 0;
let backgroundOn = false;
let imageCandidateIndex = 0;

function setStatus(message){ statusText.textContent = message; }

function tryImage(element, baseName, extensions, index = 0){
  if(index >= extensions.length){
    element.removeAttribute("src");
    setStatus("找不到圖片「" + baseName + "」，請確認 graphics 資料夾內的檔名及副檔名。");
    return;
  }
  element.onerror = () => tryImage(element, baseName, extensions, index + 1);
  element.src = GRAPHICS_DIR + encodeURIComponent(baseName) + "." + extensions[index];
}

function loadPage(page){
  currentPage = Math.max(0, Math.min(TOTAL_PAGES - 1, page));
  const baseName = String(currentPage);
  tryImage(storyImage, baseName, IMAGE_EXTENSIONS);
  pageNumber.textContent = `第 ${currentPage + 1} / ${TOTAL_PAGES} 頁`;
  progress.style.width = `${((currentPage + 1) / TOTAL_PAGES) * 100}%`;
  document.getElementById("prevBtn").disabled = currentPage === 0;
  document.getElementById("nextBtn").disabled = currentPage === TOTAL_PAGES - 1;
  stopPageSounds();
  setStatus(`現在閱讀第 ${currentPage + 1} 頁。點擊圖片或「聽故事朗讀」即可播放。`);
}

function stopPageSounds(){
  speechAudio.pause(); speechAudio.currentTime = 0;
  pageMusicAudio.pause(); pageMusicAudio.currentTime = 0;
}

function playAudio(audio, path, label){
  stopPageSounds();
  audio.src = path;
  audio.load();
  audio.play().then(() => setStatus(`正在播放：${label}`))
    .catch(() => setStatus(`無法播放「${label}」，請確認音檔名稱、格式及路徑。`));
}

function playSpeech(){
  playAudio(speechAudio, `${SPEECH_DIR}speech${currentPage}.mp3`, `第 ${currentPage + 1} 頁故事朗讀`);
}
function playPageMusic(){
  playAudio(pageMusicAudio, `${MUSIC_DIR}music${currentPage}.mp3`, `第 ${currentPage + 1} 頁音樂`);
}

document.getElementById("startBtn").addEventListener("click", () => {
  cover.style.display = "none";
  reader.style.display = "block";
  loadPage(0);
  window.scrollTo({top:0,behavior:"smooth"});
});
document.getElementById("backCover").addEventListener("click", () => {
  stopPageSounds();
  reader.style.display = "none";
  cover.style.display = "grid";
  window.scrollTo({top:0,behavior:"smooth"});
});
document.getElementById("prevBtn").addEventListener("click", () => loadPage(currentPage - 1));
document.getElementById("nextBtn").addEventListener("click", () => loadPage(currentPage + 1));
document.getElementById("readBtn").addEventListener("click", playSpeech);
document.getElementById("musicBtn").addEventListener("click", playPageMusic);
document.getElementById("stopBtn").addEventListener("click", () => {
  stopPageSounds();
  setStatus("已停止本頁的朗讀與音樂。");
});
storyImage.addEventListener("click", playSpeech);
storyImage.addEventListener("keydown", event => {
  if(event.key === "Enter" || event.key === " "){ event.preventDefault(); playSpeech(); }
});

bgToggle.addEventListener("click", async () => {
  if(!backgroundOn){
    backgroundAudio.src = MUSIC_DIR + encodeURIComponent("伴奏.mp3");
    backgroundAudio.load();
    try{
      await backgroundAudio.play();
      backgroundOn = true;
      bgToggle.textContent = "♫ 關閉背景音樂";
      setStatus("背景音樂播放中。");
    }catch(error){
      setStatus("背景音樂無法播放，請確認 music 資料夾內有「伴奏.mp3」。");
    }
  }else{
    backgroundAudio.pause();
    backgroundOn = false;
    bgToggle.textContent = "♫ 開啟背景音樂";
    setStatus("背景音樂已暫停。");
  }
});

document.addEventListener("keydown", event => {
  if(reader.style.display !== "block") return;
  if(event.key === "ArrowLeft") loadPage(currentPage - 1);
  if(event.key === "ArrowRight") loadPage(currentPage + 1);
  if(event.code === "Space" && event.target.tagName !== "BUTTON"){
    event.preventDefault(); playSpeech();
  }
});

// 封面使用第 0 張故事圖；小精靈圖片為你提供的 spirit.png。
tryImage(coverImage, "0", IMAGE_EXTENSIONS);
document.getElementById("spirit").src = GRAPHICS_DIR + "spirit.png";
</script>
</body>
</html>
